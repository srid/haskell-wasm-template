<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haskell WASM + Reflex</title>
</head>
<body>
  <!--
    How this works:

    1. GHC compiles the Reflex app to a WASI reactor module (bin.wasm)
    2. post-link.mjs extracts JSFFI metadata and generates ghc_wasm_jsffi.js
    3. JSaddle bridges Reflex's DOM operations to actual browser DOM calls
    4. browser_wasi_shim provides WASI syscalls the Haskell RTS expects
    5. index.js loads everything, initializes WASI, and calls hs_start()
  -->

  <script src="index.js" type="module"></script>
</body>
</html>

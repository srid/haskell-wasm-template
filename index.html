<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haskell WASM Template</title>
  <style>
    /* Simple loading state while WASM initializes */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      color: #333;
    }
  </style>
</head>
<body>
  <p id="loading">Loading WASM…</p>

  <!--
    How GHC WASM + JSFFI works in the browser:

    1. GHC compiles Haskell to a .wasm file (a WASI reactor module).
    2. The post-linker (post-link.mjs) extracts JSFFI metadata from the
       .wasm file and generates a .js module with the JS glue code.
    3. We need a WASI shim because the .wasm module expects WASI syscalls
       (e.g. for fd_write used by putStrLn). In the browser, there's no
       native WASI, so browser_wasi_shim provides a polyfill.
    4. We instantiate the WASM module, giving it both:
       - WASI imports (from browser_wasi_shim)
       - JSFFI imports (from the post-linker-generated JS)
    5. After initialization, we call our exported Haskell function (hs_start).
  -->

  <script type="module">
    // ---------------------------------------------------------------------------
    // 1. Import the WASI shim for browser environments
    //    This provides the wasi_snapshot_preview1 imports that GHC's RTS expects.
    //    See: https://github.com/aspect-build/aspect/tree/main/aspect-build/aspect-build-browser-wasi-shim
    // ---------------------------------------------------------------------------
    import { WASI, OpenFile, File, ConsoleStdout }
      from "https://esm.sh/@bjorn3/browser_wasi_shim@0.3.0";

    // ---------------------------------------------------------------------------
    // 2. Import the JSFFI glue code generated by GHC's post-linker
    //    This module exports a function that, given the wasm exports object,
    //    returns the ghc_wasm_jsffi import namespace needed for instantiation.
    // ---------------------------------------------------------------------------
    import jsffi from "./Main.js";

    // ---------------------------------------------------------------------------
    // 3. Set up WASI with basic stdio
    //    - stdin:  empty file (no input)
    //    - stdout: goes to console.log
    //    - stderr: goes to console.warn
    // ---------------------------------------------------------------------------
    const wasi = new WASI(
      [],   // command-line args
      [],   // environment variables
      [
        new OpenFile(new File([])),                   // fd 0: stdin
        ConsoleStdout.lineBuffered(console.log),      // fd 1: stdout
        ConsoleStdout.lineBuffered(console.warn),     // fd 2: stderr
      ]
    );

    // ---------------------------------------------------------------------------
    // 4. Instantiate the WASM module
    //    We use a knot-tying trick: the JSFFI imports need access to the wasm
    //    exports (e.g. memory), but exports are only available after instantiation.
    //    Solution: pass a mutable object, populate it after instantiation.
    // ---------------------------------------------------------------------------
    const __exports = {};

    const { instance } = await WebAssembly.instantiateStreaming(
      fetch("./Main.wasm"),
      {
        // WASI syscall imports (fd_write, proc_exit, etc.)
        wasi_snapshot_preview1: wasi.wasiImport,

        // JSFFI imports (the JS functions that Haskell's foreign imports call)
        ghc_wasm_jsffi: jsffi(__exports),
      }
    );

    // Complete the knot: now __exports has all wasm exports including memory
    Object.assign(__exports, instance.exports);

    // ---------------------------------------------------------------------------
    // 5. Initialize and run
    //    wasi.initialize() calls the _initialize export of the reactor module,
    //    which sets up the Haskell RTS. Then we call our exported hs_start.
    // ---------------------------------------------------------------------------
    wasi.initialize(instance);
    await __exports.hs_start();
  </script>
</body>
</html>
